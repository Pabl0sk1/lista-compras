<div class="se-logo" [class]="'se-logo--' + size">
  <!-- La marca va dentro de una baldosa blanca (como el icono de la app) para
       que el carrito verde y azul se lea igual sobre la barra verde de la
       cabecera y sobre el fondo oscuro. -->
  <span class="se-logo__marca">
    <img src="assets/logo/marca.png" alt="" aria-hidden="true" draggable="false">
  </span>

  <!-- Texto en HTML: nítido en cualquier pantalla, traducible y accesible -->
  <p class="se-logo__nombre">Shop <span>Easy</span></p>
  <p class="se-logo__lema" *ngIf="tagline">Tu lista de compras inteligente</p>
</div>
