<div class="se-logo" [class]="'se-logo--' + size">
  <!-- La marca va en línea (no como <img>) para que herede currentColor y
       se adapte sola al modo oscuro. -->
  <svg class="se-logo__marca" viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <path d="M5 11h5.6a4 4 0 0 1 3.9 3.1L15.6 19" stroke="currentColor" stroke-width="4.6"
      stroke-linecap="round" stroke-linejoin="round" />
    <path d="M15.6 19h42.2l-4.9 19.6a6 6 0 0 1-5.82 4.54H26.9a6 6 0 0 1-5.85-4.66L15.6 19Z" stroke="currentColor"
      stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="27" cy="53.5" r="4.6" fill="currentColor" />
    <circle cx="47" cy="53.5" r="4.6" fill="currentColor" />
    <path d="M26.5 30.6l5.6 5.6 11.4-11.4" class="se-logo__check" stroke-width="5.4" stroke-linecap="round"
      stroke-linejoin="round" />
  </svg>

  <!-- Texto en HTML: nítido en cualquier pantalla, traducible y accesible -->
  <p class="se-logo__nombre">Shop<span>Easy</span></p>
  <p class="se-logo__lema" *ngIf="tagline">Listas de compra inteligentes</p>
</div>
