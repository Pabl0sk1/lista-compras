<ion-item class="custom-input" lines="none">
  <ion-icon *ngIf="icon" slot="start" [name]="icon" aria-hidden="true"></ion-icon>

  <ion-input [type]="type" [autocomplete]="autocomplete" [label]="label" [formControl]="control"
    labelPlacement="floating"></ion-input>

  <ion-button *ngIf="isPassword" (click)="showOrHidePassword()" slot="end" fill="clear" shape="round">
    <ion-icon color="medium" slot="icon-only" [name]="hide ? 'eye-outline' : 'eye-off-outline'"
      [attr.aria-label]="hide ? 'Mostrar contraseña' : 'Ocultar contraseña'"></ion-icon>
  </ion-button>
</ion-item>
