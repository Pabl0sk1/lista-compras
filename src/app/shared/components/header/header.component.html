<ion-header class="ion-no-border">
  <ion-toolbar class="se-toolbar" [class.se-toolbar--marca]="brand">

    <ion-buttons slot="start">
      <ion-button shape="round" (click)="dismissModal()" *ngIf="isModal">
        <ion-icon slot="icon-only" name="close-outline" aria-label="Cerrar"></ion-icon>
      </ion-button>

      <ion-back-button *ngIf="backButton" [defaultHref]="backButton" text=""></ion-back-button>
    </ion-buttons>

    <!-- Dentro de la app la cabecera lleva la marca; en los modales, el título
         de la acción, que es lo que da contexto ahí. -->
    <div class="se-marca" *ngIf="brand">
      <app-logo size="sm"></app-logo>
    </div>
    <ion-title class="title-head" *ngIf="!brand">{{title}}</ion-title>

  </ion-toolbar>
</ion-header>
