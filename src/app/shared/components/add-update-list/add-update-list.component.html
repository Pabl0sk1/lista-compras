<app-header [isModal]="true" [title]="list ? 'Actualizar lista' : 'Nueva lista'"></app-header>

<ion-content>
  <div class="modal-cuerpo">

    <app-custom-input-list [control]="form.controls.title" type="text" label="Título"></app-custom-input-list>
    <div class="validators" *ngIf="form.controls.title.errors && form.controls.title.touched">
      <div *ngIf="form.controls.title.errors?.['required']">El título es obligatorio.</div>
      <div *ngIf="form.controls.title.errors?.['maxlength']">El título no puede superar los 100 caracteres.</div>
    </div>

    <app-custom-input-list [control]="form.controls.dateHour" type="datetime-local"></app-custom-input-list>

    <!-- Cabecera de items con progreso -->
    <div class="items-cabecera">
      <div class="items-cabecera__fila">
        <h3>Items</h3>
        <span class="items-cabecera__cuenta" *ngIf="tempItems.length">
          {{getCompletados()}} de {{tempItems.length}}
        </span>
        <ion-button fill="clear" shape="round" (click)="createItem()">
          <ion-icon slot="icon-only" name="add-circle" aria-label="Añadir item"></ion-icon>
        </ion-button>
      </div>

      <!-- Barra de solo lectura: antes era un ion-range arrastrable, así que
           el progreso se podía "mover" a mano sin marcar nada. -->
      <div class="se-progreso" *ngIf="tempItems.length" [class.completo]="getPercentaje() === 100">
        <span [style.width.%]="getPercentaje()"></span>
      </div>
    </div>

    <!-- Items -->
    <ion-reorder-group class="items-lista" [disabled]="false" (ionItemReorder)="handleReorder($any($event))">
      <ion-item class="item-fila" lines="none" *ngFor="let item of tempItems; index as i">
        <ion-checkbox class="custom-checkbox" mode="ios" slot="start" labelPlacement="end" justify="start"
          [checked]="item.completed" (ionChange)="toggleItemCompleted(i, $event)">
          <span class="item-nombre" [class.hecho]="item.completed">{{item.name}}</span>
        </ion-checkbox>

        <ion-buttons slot="end">
          <ion-button (click)="removeItem(i)" shape="round">
            <ion-icon slot="icon-only" name="close" color="medium" aria-label="Quitar item"></ion-icon>
          </ion-button>
          <!-- El asa va en la misma fila; antes ocupaba una fila extra por item -->
          <ion-reorder class="item-asa"></ion-reorder>
        </ion-buttons>
      </ion-item>
    </ion-reorder-group>

    <!-- Sin items -->
    <div class="empty" *ngIf="!tempItems.length">
      <div class="empty-icono">
        <ion-icon name="list-outline"></ion-icon>
      </div>
      <h3>Esta lista está vacía</h3>
      <p>Añade lo que necesitas comprar con el botón <strong>+</strong>.</p>
    </div>
  </div>
</ion-content>

<ion-footer class="modal-pie">
  <ion-button expand="block" mode="ios" color="primary" [disabled]="form.invalid || !tempItems.length"
    (click)="submit()">
    {{list ? 'Guardar cambios' : 'Crear lista'}}
  </ion-button>
</ion-footer>
