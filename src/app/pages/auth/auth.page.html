<ion-content>
  <div class="d-flex-center">
    <form [formGroup]="form" class="auth-form" (ngSubmit)="submit()" (keypress.enter)="submit()">

      <div class="auth-cabecera">
        <app-logo size="lg" [tagline]="true"></app-logo>
      </div>

      <app-custom-input icon="mail-outline" autocomplete="email" [control]="form.controls.email" type="email"
        label="Correo"></app-custom-input>
      <div class="validators" *ngIf="form.controls.email.errors && form.controls.email.touched">
        <div *ngIf="form.controls.email.errors?.['required']">El correo es obligatorio.</div>
        <div *ngIf="form.controls.email.errors?.['email']">El correo es inválido.</div>
      </div>

      <app-custom-input icon="lock-closed-outline" autocomplete="current-password" [control]="form.controls.password"
        type="password" label="Contraseña"></app-custom-input>
      <div class="validators" *ngIf="form.controls.password.errors && form.controls.password.touched">
        <div *ngIf="form.controls.password.errors?.['required']">La contraseña es obligatoria.</div>
      </div>

      <!-- Botón real, no un <p> con routerLink: así es alcanzable por teclado
           y anunciable por lectores de pantalla. -->
      <div class="ion-text-end">
        <button type="button" routerLink="forgot-password" class="forgot-password">¿Has olvidado tu
          contraseña?</button>
      </div>

      <ion-button color="primary" expand="block" mode="ios" class="submit" type="submit" [disabled]="form.invalid">
        Iniciar Sesión
        <ion-icon slot="end" name="log-in-outline"></ion-icon>
      </ion-button>

      <div class="auth-separador"><span>o</span></div>

      <ion-button color="medium" routerLink="sign-up" expand="block" mode="ios" fill="outline">
        Crear una cuenta
        <ion-icon slot="end" name="person-add-outline"></ion-icon>
      </ion-button>
    </form>
  </div>
</ion-content>
