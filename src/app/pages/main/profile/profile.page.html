<app-header [brand]="true"></app-header>
<ion-content>
  <div class="perfil">

    <section class="perfil__tarjeta">
      <button class="perfil__avatar" (click)="opcionesFoto()"
        [attr.aria-label]="user.photo ? 'Cambiar o eliminar tu foto' : 'Añadir una foto de perfil'">
        <img *ngIf="user.photo" [src]="user.photo" alt="" />
        <span class="perfil__inicial" *ngIf="!user.photo">{{inicial()}}</span>
        <span class="perfil__camara">
          <ion-icon name="camera" aria-hidden="true"></ion-icon>
        </span>
      </button>

      <!-- Selector nativo, oculto: lo dispara el avatar -->
      <input #selectorFoto type="file" accept="image/png,image/jpeg,image/webp" hidden
        (change)="fotoElegida($event)" />

      <h2 class="perfil__nombre">{{user.name}}</h2>
      <p class="perfil__email">{{user.email}}</p>
    </section>

    <p class="perfil__etiqueta">Apariencia</p>
    <section class="perfil__grupo perfil__tema">
      <ion-segment [value]="tema" (ionChange)="cambiarTema($any($event))" mode="ios">
        <ion-segment-button value="light">
          <ion-icon name="sunny-outline"></ion-icon>
          <ion-label>Claro</ion-label>
        </ion-segment-button>
        <ion-segment-button value="dark">
          <ion-icon name="moon-outline"></ion-icon>
          <ion-label>Oscuro</ion-label>
        </ion-segment-button>
        <ion-segment-button value="system">
          <ion-icon name="phone-portrait-outline"></ion-icon>
          <ion-label>Sistema</ion-label>
        </ion-segment-button>
      </ion-segment>
      <p class="perfil__ayuda" *ngIf="tema === 'system'">Sigue la configuración de tu dispositivo.</p>
    </section>

    <p class="perfil__etiqueta">Cuenta</p>
    <section class="perfil__grupo">
      <button class="perfil__accion" (click)="editProfile()">
        <ion-icon name="person-outline"></ion-icon>
        <span>Editar perfil</span>
        <ion-icon class="perfil__flecha" name="chevron-forward"></ion-icon>
      </button>

      <button class="perfil__accion" (click)="changePassword()">
        <ion-icon name="key-outline"></ion-icon>
        <span>Cambiar contraseña</span>
        <ion-icon class="perfil__flecha" name="chevron-forward"></ion-icon>
      </button>

      <button class="perfil__accion" (click)="signOut()">
        <ion-icon name="log-out-outline"></ion-icon>
        <span>Cerrar sesión</span>
        <ion-icon class="perfil__flecha" name="chevron-forward"></ion-icon>
      </button>
    </section>

    <p class="perfil__etiqueta">Zona de riesgo</p>
    <section class="perfil__grupo perfil__grupo--peligro">
      <button class="perfil__accion peligro" (click)="confirmDeleteLists()">
        <ion-icon name="trash-outline"></ion-icon>
        <span>Eliminar todas las listas</span>
        <ion-icon class="perfil__flecha" name="chevron-forward"></ion-icon>
      </button>

      <button class="perfil__accion peligro" (click)="confirmDeleteAccount()">
        <ion-icon name="close-circle-outline"></ion-icon>
        <span>Borrar mi cuenta</span>
        <ion-icon class="perfil__flecha" name="chevron-forward"></ion-icon>
      </button>
    </section>

    <p class="perfil__pie">ShopEasy</p>
  </div>
</ion-content>
