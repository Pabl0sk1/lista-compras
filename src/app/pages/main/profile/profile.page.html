<app-header title="Perfil"></app-header>
<ion-content>
  <div class="perfil">

    <section class="perfil__tarjeta">
      <div class="perfil__avatar">{{inicial()}}</div>
      <h2 class="perfil__nombre">{{user.name}}</h2>
      <p class="perfil__email">{{user.email}}</p>
    </section>

    <section class="perfil__grupo">
      <button class="perfil__accion" (click)="editProfile()">
        <ion-icon name="person-outline"></ion-icon>
        <span>Editar perfil</span>
        <ion-icon class="perfil__flecha" name="chevron-forward"></ion-icon>
      </button>

      <button class="perfil__accion" (click)="signOut()">
        <ion-icon name="log-out-outline"></ion-icon>
        <span>Cerrar sesión</span>
        <ion-icon class="perfil__flecha" name="chevron-forward"></ion-icon>
      </button>
    </section>

    <p class="perfil__etiqueta">Zona de riesgo</p>
    <section class="perfil__grupo perfil__grupo--peligro">
      <button class="perfil__accion peligro" (click)="confirmDeleteLists()">
        <ion-icon name="trash-outline"></ion-icon>
        <span>Eliminar todas las listas</span>
        <ion-icon class="perfil__flecha" name="chevron-forward"></ion-icon>
      </button>

      <button class="perfil__accion peligro" (click)="confirmDeleteAccount()">
        <ion-icon name="close-circle-outline"></ion-icon>
        <span>Borrar mi cuenta</span>
        <ion-icon class="perfil__flecha" name="chevron-forward"></ion-icon>
      </button>
    </section>

    <p class="perfil__pie">ShopEasy</p>
  </div>
</ion-content>
