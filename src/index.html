<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8"/>
  <title>ShopEasy</title>

  <base href="/"/>

  <meta name="color-scheme" content="light dark"/>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="msapplication-tap-highlight" content="no"/>
  <meta name="description" content="Organiza tus listas de compra y no te olvides de nada."/>

  <!-- La barra del navegador acompaña al color de la cabecera en cada modo -->
  <meta name="theme-color" content="#15803D" media="(prefers-color-scheme: light)"/>
  <meta name="theme-color" content="#131C2E" media="(prefers-color-scheme: dark)"/>

  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/fav-32.png"/>
  <link rel="icon" type="image/png" sizes="48x48" href="assets/icon/fav-48.png"/>
  <link rel="apple-touch-icon" href="assets/logo/icon-maskable-512.png"/>

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <link rel="manifest" href="manifest.webmanifest">
</head>

<body>
  <app-root></app-root>
  <!-- Ionicons se sirve desde la propia app (no desde un CDN externo) -->
  <script type="module" src="assets/ionicons/ionicons.esm.js"></script>
  <script nomodule="" src="assets/ionicons/ionicons.js"></script>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
