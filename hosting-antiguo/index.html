<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>ShopEasy cambió de dirección</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://shopeasy-app.web.app/">
  <!-- Respaldo sin JavaScript. Con JS se salta antes y conservando la ruta. -->
  <meta http-equiv="refresh" content="2; url=https://shopeasy-app.web.app/">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0B1120;
      color: #E8EDF5;
      font: 16px/1.6 system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }

    a {
      color: #4ADE80;
    }
  </style>
</head>

<body>
  <div>
    <h1>ShopEasy se mudó</h1>
    <p>Ahora está en <a id="destino" href="https://shopeasy-app.web.app/">shopeasy-app.web.app</a></p>
  </div>

  <script>
    (function () {
      var nuevo = 'https://shopeasy-app.web.app';

      // Quien abrió la app aquí tiene registrado el service worker de Angular,
      // que sirve la copia guardada aunque el servidor ya no la publique. Hay
      // que darlo de baja o esta dirección seguiría mostrando la app.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          rs.forEach(function (r) { r.unregister(); });
        }).catch(function () { });
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (ns) {
          ns.forEach(function (n) { caches.delete(n); });
        }).catch(function () { });
      }

      // Se conserva la ruta: un enlace guardado a una pantalla concreta sigue
      // llevando a esa pantalla.
      var destino = nuevo + location.pathname + location.search + location.hash;
      document.getElementById('destino').href = destino;
      setTimeout(function () { location.replace(destino); }, 400);
    })();
  </script>
</body>

</html>
